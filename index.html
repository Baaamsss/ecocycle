<script>
(() => {
 'use strict';
 const KEY='ecocycle-demo-v1';
 const categories=['Penumpukan Sampah','Pembuangan Liar','Saluran Tersumbat','Limbah Cair','Lainnya'];
 const STATUS={wait:'Menunggu Verifikasi',process:'Diproses',done:'Selesai'};
 const icons={home:'i-home',report:'i-report',status:'i-status',dashboard:'i-chart',learn:'i-book',news:'i-news'};
 let route='home',filter='all',search='',photoDraft=null,toastTimer=null;
 const $=sel=>document.querySelector(sel);
 const icon=(name,cls='')=>`<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
 const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const agoDays=n=>new Date(Date.now()-n*86400000).toISOString();
 const seed=[
  {id:'EC-1001',title:'Tumpukan sampah dekat pos ronda',category:'Penumpukan Sampah',place:'Jl. Melati RT 03',detail:'Sampah rumah tangga menumpuk di tepi jalan.',author:'Warga RT 03',status:'done',createdAt:agoDays(5.3),startedAt:agoDays(5),doneAt:agoDays(4.4),photo:null},
  {id:'EC-1002',title:'Sampah plastik di pinggir saluran',category:'Pembuangan Liar',place:'Sisi Jalan Anggrek',detail:'Terlihat sampah plastik bercampur dengan residu.',author:'Warga RW 02',status:'process',createdAt:agoDays(2),startedAt:agoDays(1.2),doneAt:null,photo:null},
  {id:'EC-1003',title:'Drainase tersumbat sampah',category:'Saluran Tersumbat',place:'Gang Kenanga RT 05',detail:'Aliran air terhalang sampah dan dedaunan.',author:'Warga RT 05',status:'wait',createdAt:agoDays(1),startedAt:null,doneAt:null,photo:null},
  {id:'EC-1004',title:'Sampah campuran di area taman',category:'Penumpukan Sampah',place:'Taman Lingkungan RW 04',detail:'Area taman digunakan sebagai lokasi pembuangan.',author:'Warga RW 04',status:'done',createdAt:agoDays(7.5),startedAt:agoDays(7),doneAt:agoDays(5.7),photo:null},
  {id:'EC-1005',title:'Laporan sampah dekat pasar',category:'Pembuangan Liar',place:'Belakang Pasar Lingkungan',detail:'Ditemukan pembuangan tidak pada tempatnya.',author:'Pengunjung pasar',status:'wait',createdAt:agoDays(.3),startedAt:null,doneAt:null,photo:null}
 ];
 function load(){try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);if(Array.isArray(parsed))return parsed;}}catch(e){}return seed.map(r=>({...r}));}
 let reports=load();
 function save(){try{localStorage.setItem(KEY,JSON.stringify(reports));return true;}catch(e){toast('Penyimpanan browser penuh/terbatas. Data tetap tersedia sampai halaman dimuat ulang.');return false;}}
 function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500);}
 function date(d){if(!d)return '—';return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',year:'numeric'}).format(new Date(d));}
 function dateTime(d){if(!d)return '—';return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(d));}
 function stats(){const total=reports.length,wait=reports.filter(r=>r.status==='wait').length,process=reports.filter(r=>r.status==='process').length,done=reports.filter(r=>r.status==='done').length;const durations=reports.filter(r=>r.doneAt).map(r=>(new Date(r.doneAt)-new Date(r.createdAt))/3600000).filter(n=>n>=0);const avg=durations.length?durations.reduce((a,b)=>a+b,0)/durations.length:null;return {total,wait,process,done,follow:total?Math.round((process+done)/total*100):0,donePct:total?Math.round(done/total*100):0,avg};}
 function avgText(n){if(n==null)return '—';if(n<1)return `${Math.max(1,Math.round(n*60))} menit`;if(n<48)return `${n.toFixed(1).replace('.',',')} jam`;return `${(n/24).toFixed(1).replace('.',',')} hari`;}
 function badge(status){return `<span class="status ${status}"><i></i>${STATUS[status]||'Tidak diketahui'}</span>`;}
 function kpi(label,value,detail,symbol){return `<article class="card stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon(symbol,'sm')}</span></div><div class="stat-number">${esc(value)}</div><div class="stat-detail">${detail}</div></article>`;}
 function topRecent(r){return `<div class="mini-report"><div class="marker">${icon('pin')}</div><div class="text"><strong>${esc(r.title)}</strong><small>${esc(r.place)} · ${date(r.createdAt)}</small></div>${badge(r.status)}</div>`;}
 function heading(eyebrow,title,description,extra=''){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>${extra}</div>`;}
 const LEARN_KEY='ecocycle-learn-v2';
 let lessons=[
 ['sort','Pemilahan di sumber','Pisahkan organik, material daur ulang yang bersih, residu, dan sampah berbahaya seperti baterai. Ikuti ketentuan layanan setempat.','Siapkan wadah terpisah. Jangan masukkan baterai atau benda tajam ke kompos.'],
 ['3r','3R: cegah sebelum mengolah','Reduce mencegah timbulan; Reuse menggunakan kembali barang; Recycle mengolah bahan menjadi material baru. Utamakan pengurangan dan guna ulang yang aman.','Bawa botol isi ulang atau tas belanja yang bisa dipakai kembali.'],
 ['organic','Kelola sampah organik','Sisa makanan dan daun dapat dikomposkan dengan pengaturan udara, kelembapan dan bahan yang sesuai. Bau menyengat dapat menandakan masalah proses.','Kurangi sisa makanan terlebih dahulu. Pisahkan plastik dari bahan kompos.'],
 ['water','Lindungi air dan drainase','Sampah dapat menyumbat aliran; lindi dan bahan pencemar dapat mencapai air atau tanah. Risiko bergantung pada jenis pencemar dan jalur pajanan.','Jangan buang sampah, minyak atau bahan kimia ke saluran.'],
 ['burn','Hindari pembakaran terbuka','Pembakaran sampah terbuka dapat melepaskan partikulat dan gas berbahaya. Anak, lansia dan penderita penyakit pernapasan lebih rentan.','Gunakan layanan pengangkutan dan pemilahan. Jangan mendekati asap atau api untuk mengambil foto.'],
 ['safe','Melapor dengan aman','Dokumentasikan dari tempat aman. Jangan menyentuh jarum, bahan kimia tidak dikenal, atau limbah medis. Status selesai tidak membuktikan lokasi sudah bersih.','Hubungi petugas berwenang untuk masalah nyata. Hindari mengunggah wajah, alamat pribadi dan data sensitif.']
 ].map(([id,title,body,action])=>({id,title,body,action}));
 const missions=[
 [['bottle','Gunakan botol isi ulang','Ganti satu minuman kemasan jika memungkinkan.'],['sort','Cek pemilahan di rumah','Pastikan sampah berbahaya dipisah.'],['meal','Rencanakan porsi makanan','Cegah sisa makanan yang tidak perlu.']],
 [['bag','Bawa tas belanja guna ulang','Kurangi kebutuhan kantong baru.'],['reuse','Gunakan kembali satu barang','Pilih barang yang aman dan layak.'],['learn','Kenali layanan sampah lokal','Cari informasi jadwal atau lokasi resmi.']],
 [['pack','Pilih kemasan lebih sedikit','Lakukan jika pilihan tersedia.'],['repair','Rawat atau perbaiki barang','Perpanjang masa pakainya.'],['share','Bagikan satu tips pemilahan','Sampaikan informasi yang sudah diperiksa.']]
 ].map(w=>w.map(([id,title,desc])=>({id,title,desc})));
 const quizzes=[
 ['Botol air yang masih layak digunakan kembali termasuk apa?',['Reduce saja','Reuse','Pemrosesan akhir'],1,'Reuse berarti menggunakan kembali barang tanpa mengolahnya menjadi bahan baru.'],
 ['Baterai bekas sebaiknya ditempatkan di mana?',['Kompos','Dicampur dengan kertas','Dikumpulkan terpisah sesuai layanan setempat'],2,'Baterai perlu penanganan khusus.'],
 ['Indikator terbaik untuk menilai pengurangan sampah?',['Berat residu sebelum dan sesudah pada cakupan setara','Jumlah kunjungan website','Jumlah notifikasi'],0,'Pengukuran residu pada kondisi sebanding menilai perubahan fisik.'],
 ['Mengapa pembakaran sampah terbuka perlu dihindari?',['Karena semua sampah bisa dikomposkan','Karena emisi dan partikulat dapat meningkatkan pajanan','Karena asap selalu bebas racun'],1,'Pembakaran terbuka dapat menghasilkan pencemar udara.'],
 ['Saat menemukan jarum bekas di jalan, tindakan terbaik?',['Ambil dengan tangan','Bawa pulang untuk dipilah','Jauhkan diri dan hubungi petugas berwenang'],2,'Benda tajam berpotensi menimbulkan luka dan pajanan.'],
 ['Laporan berubah menjadi selesai. Apa yang belum terbukti?',['Status administratif berubah','Kondisi lapangan benar-benar membaik','Ada laporan di data demo'],1,'Perlu observasi atau bukti lapangan untuk memastikan perubahan lingkungan.'],
 ['Kompos terlalu basah dan berbau. Apa yang perlu diperiksa?',['Aerasi, kelembapan dan bahan campuran','Warna logo aplikasi','Jumlah laporan masuk'],0,'Kondisi proses komposting memengaruhi penguraian.']
 ].map(([q,o,a,why])=>({q,o,a,why}));
 function dayNumber(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v=Object.fromEntries(p.map(x=>[x.type,x.value]));return Math.floor(Date.UTC(+v.year,+v.month-1,+v.day)/86400000);}
 function weekNumber(){return Math.floor((dayNumber()+3)/7);}
 function getLearn(){try{const x=JSON.parse(localStorage.getItem(LEARN_KEY)||'{}');return {read:Array.isArray(x.read)?x.read:[],missions:x.missions&&typeof x.missions==='object'?x.missions:{},answers:x.answers&&typeof x.answers==='object'?x.answers:{}};}catch(e){return {read:[],missions:{},answers:{}}}}
 let learning=getLearn();
 function saveLearn(){try{localStorage.setItem(LEARN_KEY,JSON.stringify(learning));}catch(e){toast('Progres hanya tersimpan selama halaman ini terbuka.');}}
 function currentMissions(){return missions[weekNumber()%missions.length];}
 function learnSummary(){return {n:lessons.filter(l=>learning.read.includes(l.id)).length,m:currentMissions().filter(x=>learning.missions[weekNumber()+':'+x.id]).length,q:Object.keys(learning.answers).length};}
 function dailyQuiz(){const day=dayNumber(),q=quizzes[day%quizzes.length],a=learning.answers[day];return `<div class="eco-label">Kuis hari ini · Berganti setiap hari</div><h3>${esc(q.q)}</h3>${q.o.map((o,i)=>`<button type="button" class="btn btn-outline eco-answer ${a===undefined?'':i===q.a?'correct':i===a?'wrong':''}" data-eco-answer="${i}" ${a!==undefined?'disabled':''}>${esc(o)}</button>`).join('')}${a!==undefined?`<p class="eco-study" role="status"><strong>${a===q.a?'Tepat!':'Belum tepat.'}</strong> ${esc(q.why)}</p>`:'<p class="eco-meta">Pilih satu jawaban untuk melihat pembahasan.</p>'}`;}

 let lessonSearch='',lessonCategory='all',lessonShown=12,libraryLoaded=false;
 function searchableLesson(l){return (l.title+' '+l.body+' '+(l.category||'Sampah')).toLowerCase().includes(lessonSearch.toLowerCase())&&(lessonCategory==='all'||(l.category||'Sampah')===lessonCategory);}
 function lessonCard(l){return `<article class="card eco-card eco-lesson-card"><span class="eco-label">${esc(l.category||'Dasar lingkungan')}</span><h3>${esc(l.title)}</h3><p>${esc(l.body)}</p><div class="eco-study"><strong>Aksi praktis</strong><p>${esc(l.action)}</p></div><button class="btn btn-outline" data-eco-read="${esc(l.id)}">${learning.read.includes(l.id)?'✓ Sudah dibaca · Batalkan':'Tandai selesai dibaca'}</button></article>`;}
 function renderLessonCards(){const selected=lessons.filter(searchableLesson);const slot=$('#ecoLessonCards');if(slot)slot.innerHTML=selected.length?selected.slice(0,lessonShown).map(lessonCard).join(''):'<div class="eco-empty">Tidak ada materi sesuai pencarian. Coba kategori lain.</div>';const count=$('#ecoLessonCount');if(count)count.textContent=`${Math.min(lessonShown,selected.length)} dari ${selected.length} materi`;const more=$('#ecoMoreLessons');if(more)more.hidden=lessonShown>=selected.length;}
 async function loadLibrary(){try{const res=await fetch('./lessons.json?rev=3',{cache:'no-store'});if(!res.ok)throw Error('Library not found');const d=await res.json();if(Array.isArray(d.lessons)&&d.lessons.length>=6&&d.lessons.every(l=>typeof l.id==='string'&&typeof l.title==='string'&&typeof l.body==='string'&&typeof l.action==='string')){lessons=d.lessons;libraryLoaded=true;}}catch(e){libraryLoaded=false;}if(route==='learn'||route==='home')render();}

 let newsItems=[],newsMode='Baca kabar dan wawasan lingkungan dari penerbit pilihan.',newsChecked='',newsUpdated='',newsLoading=false,newsSearch='',newsSource='all',newsLimit=12,newsRecent=false,newsStatuses=[];
 const SEEN_NEWS='ecocycle-news-seen-v3';
 const GOOD_NEWS_CACHE='ecocycle-news-cache-v33-verified';
 let seenNews=[];try{seenNews=JSON.parse(localStorage.getItem(SEEN_NEWS)||'[]');if(!Array.isArray(seenNews))seenNews=[];}catch(e){seenNews=[];}
 function saveSeen(){try{localStorage.setItem(SEEN_NEWS,JSON.stringify(seenNews.slice(-300)));}catch(e){}}
 function validArticle(a){
  if(!a||typeof a.title!=='string'||typeof a.url!=='string'||typeof a.source!=='string'||typeof a.source_id!=='string')return false;
  // Artikel yang hanya ditemukan via indeks Google News tidak punya URL penerbit yang terbukti hidup.
  // Jangan tampilkan tautan perantara atau hasil pencarian sebagai artikel yang siap dibaca.
  if(a.via==='Google News RSS'||typeof a.verified_at!=='string'||!a.verified_at)return false;
  try{
   const u=new URL(a.url);
   return u.protocol==='https:'&&sources.some(s=>s.id===a.source_id&&(u.hostname===s.domain||u.hostname.endsWith('.'+s.domain)));
  }catch(e){return false;}
 }
 function articleDate(a){if(!a.date||!/^\d{4}-\d{2}-\d{2}$/.test(a.date))return null;const d=Date.parse(a.date+'T00:00:00Z');return Number.isFinite(d)?d:null;}
 function isRecentArticle(a){const d=articleDate(a);return d!==null&&d>=(Date.now()-7*86400000)&&d<=(Date.now()+86400000);}
 // EcoNews V3.2: link perantara Google News RSS tidak selalu bisa membuka artikel asli.
 // Jika URL penerbit belum tersedia, cari judul pada domain penerbit yang tercantum.
 function newsDestination(a){
  const source=sources.find(s=>s.id===a.source_id);
  if(!validArticle(a))return {href:source?.news||'https://www.google.com/',label:'Kunjungi sumber ↗',note:'Tautan langsung artikel belum terverifikasi.'};
  return {href:a.url,label:'Buka artikel ↗',note:'Tautan langsung dari RSS penerbit; dapat berubah jika penerbit menghapus artikelnya.'};
 }

 // Hilangkan judul yang sangat mirip bila berasal dari penerbit dan tanggal yang sama.
 // Hindari menghapus cerita berbeda yang hanya membahas isu umum serupa.
 function newsWords(t){return new Set(String(t||'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2));}
 function similarNews(a,b){
  if(a.source_id!==b.source_id||a.date!==b.date)return false;
  const A=newsWords(a.title),B=newsWords(b.title);let shared=0;
  A.forEach(w=>{if(B.has(w))shared++;});
  return shared>=7 && 2*shared/(A.size+B.size)>=0.59;
 }
 function dedupeNews(items){
  const result=[];
  for(const article of items){
   const idx=result.findIndex(existing=>similarNews(existing,article));
   if(idx===-1)result.push(article);
   else if(result[idx].via==='Google News RSS' && article.via!=='Google News RSS')result[idx]=article;
  }
  return result;
 }
 function updateNewsAlerts(){const n=dedupeNews(newsItems).filter(a=>isRecentArticle(a)&&!seenNews.includes(a.url)).length;document.querySelectorAll('.eco-news-alert').forEach(el=>{el.textContent=n>99?'99+':String(n);el.hidden=!n;});}
 function filteredNews(){return dedupeNews(newsItems).filter(a=>(newsSource==='all'||a.source_id===newsSource)&&((a.title+' '+a.source).toLowerCase().includes(newsSearch.toLowerCase()))&&(!newsRecent||isRecentArticle(a)));}
 function articleCards(items){const safe=dedupeNews(items.filter(validArticle));return safe.length?safe.map(a=>{const dest=newsDestination(a);return `<article class="card eco-card"><div class="eco-link-row"><span class="eco-label">${esc(a.source)}</span>${isRecentArticle(a)?'<span class="eco-mark new">Terbit ≤7 hari</span>':''}</div><h3><a class="eco-news-link" href="${esc(dest.href)}" data-eco-news-open="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h3><p class="eco-news-date">Terbit: ${esc(a.date||'Tidak diketahui')} · ${a.via==='Google News RSS'?'Indeks Google News':'RSS penerbit'}</p><div class="eco-link-row"><span class="eco-source-stats">${seenNews.includes(a.url)?'✓ Pernah diklik':'Belum diklik'}</span><a class="eco-news-link" href="${esc(dest.href)}" data-eco-news-open="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${dest.label}</a></div><p class="eco-meta" style="margin:2px 0 0">${esc(dest.note)}</p></article>`;}).join(''):'<div class="eco-empty"><h3>Jelajahi inspirasi lingkungan</h3><p>Belum ada judul yang cocok dalam koleksi ini. Lu bisa membuka publikasi terbaru lewat daftar penerbit di bawah.</p></div>';}

 function renderNewsList(){const items=filteredNews();const slot=$('#ecoNewsList');if(slot)slot.innerHTML=articleCards(items.slice(0,newsLimit));const count=$('#ecoNewsCount');if(count)count.textContent=`${Math.min(newsLimit,items.length)} dari ${items.length} artikel tersimpan`;const more=$('#ecoMoreNews');if(more)more.hidden=newsLimit>=items.length;}
 function restoreNewsCache(){
  try{const data=JSON.parse(localStorage.getItem(GOOD_NEWS_CACHE)||'null');if(!data||!Array.isArray(data.items))return;const items=data.items.filter(validArticle);if(!items.length)return;newsItems=items.sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,500);newsStatuses=Array.isArray(data.status)?data.status:[];newsChecked=typeof data.checked_at==='string'?data.checked_at:'';newsUpdated=typeof data.updated==='string'?data.updated:'';}catch(e){}
 }
 async function refreshNews(){
  if(newsLoading)return;newsLoading=true;
  const btn=$('#ecoRefresh');if(btn)btn.disabled=true;
  try{
   const res=await fetch('./news.json?t='+Date.now(),{cache:'no-store'});
   if(!res.ok)throw Error('Could not load news index');
   const d=await res.json();
   const incoming=Array.isArray(d.items)?d.items.filter(validArticle).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,500):[];
   // Never replace valid articles with an empty or broken source response.
   if(incoming.length){
    const merged=new Map(newsItems.map(x=>[x.source_id+'|'+x.url,x]));
    incoming.forEach(x=>merged.set(x.source_id+'|'+x.url,x));
    newsItems=[...merged.values()].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,500);
    newsStatuses=Array.isArray(d.status)?d.status:newsStatuses;
    newsChecked=typeof d.checked_at==='string'?d.checked_at:newsChecked;
    newsUpdated=typeof d.updated==='string'?d.updated:newsUpdated;
    try{localStorage.setItem(GOOD_NEWS_CACHE,JSON.stringify({items:newsItems,status:newsStatuses,checked_at:newsChecked,updated:newsUpdated}));}catch(e){}
   }
  }catch(e){ /* Non-critical: retain previously verified headlines; keep technical details in developer diagnostics. */
   console.warn('EcoCycle news sync:', e.message||e);
  }finally{
   newsLoading=false;
   newsMode=newsItems.length?'Artikel dari RSS penerbit yang diperiksa':'Jelajahi publikasi lingkungan dari sumber resmi';
   if(route==='news'||route==='home')render();
  }
 }

 <div class="field full"><label>Foto pendukung (opsional)</label><label class="file-box" for="r-photo" id="filePreview">${icon('camera','lg')}<strong>Pilih gambar untuk laporan</strong><small>JPG/PNG/WEBP · Disimpan lokal · Maks. 5 MB</small></label><input id="r-photo" type="file" accept="image/png,image/jpeg,image/webp" style="position:absolute;opacity:0;width:1px;height:1px" /></div>
 </div><div class="form-actions"><span class="form-helper">* Wajib diisi · Tidak dikirim ke server</span><button type="submit" class="btn btn-primary">${icon('upload','sm')} Kirim Laporan Simulasi</button></div></form></section>
 <aside class="card help-card"><div class="eyebrow">Panduan pelaporan</div><h3 style="margin-top:9px">Buat laporan yang mudah ditindaklanjuti.</h3><div class="checkline">${icon('check','sm')} Jelaskan lokasi dan titik permasalahan dengan jelas.</div><div class="checkline">${icon('check','sm')} Pilih kategori yang sesuai dengan kondisi.</div><div class="checkline">${icon('check','sm')} Lampirkan foto sebagai referensi bila tersedia.</div><div class="checkline">${icon('check','sm')} Periksa perkembangan di halaman Status Laporan.</div><div class="help-tip">${icon('info','sm')} <b>Privasi demo</b><br>Jangan masukkan data diri sensitif atau laporan darurat sebenarnya. EcoCycle versi ini tidak terhubung ke instansi penanganan limbah.</div></aside></div>`;}
 function reportCard(r){return `<article class="card record"><div class="record-photo">${r.photo?`<img src="${r.photo}" alt="Foto laporan" style="width:100%;height:100%;object-fit:cover;border-radius:12px" />`:icon('pin','lg')}</div><div class="record-main"><strong>${esc(r.title)}</strong><div class="record-meta"><span>${icon('pin','sm')} ${esc(r.place)}</span><span>${icon('clock','sm')} ${date(r.createdAt)}</span><span>${esc(r.category)}</span></div></div><div class="record-right">${badge(r.status)}<button class="btn btn-outline btn-small" data-detail="${esc(r.id)}">Detail ${icon('arrow','sm')}</button></div></article>`;}
 function filtered(){return reports.filter(r=>(filter==='all'||r.status===filter)&&[r.title,r.place,r.category,r.id,r.author].some(x=>String(x||'').toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));}
 function statusPage(){return `${heading('Pelacakan laporan','Status & Riwayat Laporan','Cari laporan yang sudah dibuat dan lihat perkembangan penanganannya.','<button class="btn btn-primary" data-route="report">'+icon('plus','sm')+' Buat Laporan</button>')}
 <div class="filter-bar"><div class="tabs" role="group" aria-label="Filter status"><button data-filter="all" class="tab ${filter==='all'?'active':''}">Semua</button><button data-filter="wait" class="tab ${filter==='wait'?'active':''}">Menunggu</button><button data-filter="process" class="tab ${filter==='process'?'active':''}">Diproses</button><button data-filter="done" class="tab ${filter==='done'?'active':''}">Selesai</button></div><label class="search">${icon('search','sm')}<input id="searchReports" aria-label="Cari laporan" placeholder="Cari judul, lokasi, atau ID..." value="${esc(search)}" /></label></div><div class="records" id="recordList"></div>
 <div class="note-band">${icon('info','lg')} Status laporan merupakan demonstrasi administrasi. Kondisi fisik titik sampah perlu verifikasi lapangan untuk menilai hasil kesehatan lingkungan.</div>`;}
 function renderRecords(){const el=$('#recordList');if(!el)return;const items=filtered();el.innerHTML=items.length?items.map(reportCard).join(''):`<div class="empty">${icon('search','lg')}<strong>Tidak ada laporan yang cocok</strong><p>Coba ubah kategori status atau kata pencarian.</p></div>`;}
 function sevenDays(){const counts=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const end=new Date(d.getTime()+86400000);counts.push({day:new Intl.DateTimeFormat('id-ID',{weekday:'short'}).format(d),n:reports.filter(r=>new Date(r.createdAt)>=d&&new Date(r.createdAt)<end).length});}return counts;}
 function dash(){const s=stats(),a=s.donePct*3.6,b=(s.donePct+(s.total?s.process/s.total*100:0))*3.6,days=sevenDays(),max=Math.max(1,...days.map(d=>d.n));const recent=[...reports].sort((x,y)=>new Date(y.createdAt)-new Date(x.createdAt));return `${heading('Panel petugas','Dashboard Pemantauan','Simulasikan verifikasi, pembaruan status, dan monitoring kinerja respons.','<button class="btn btn-outline btn-small" id="resetDemo">'+icon('refresh','sm')+' Reset Data Demo</button>')}
 <section class="stats">${kpi('Laporan Masuk',s.total,'Seluruh laporan simulasi','report')}${kpi('Menunggu',s.wait,'Belum diverifikasi','clock')}${kpi('Diproses',s.process,'Dalam penanganan','status')}${kpi('Selesai',s.done,'Status administratif selesai','check')}</section>
 <div class="dash-top"><section class="card panel"><h3>Distribusi status laporan</h3><p class="panel-note">Porsi status dalam simulasi.</p><div class="donut-wrap"><div class="donut" style="--angle:${a}deg;--angle2:${b}deg"><div class="donut-center"><strong>${s.donePct}%</strong><small>Selesai</small></div></div><div class="legend"><div class="legend-line"><i style="background:#2bb77a"></i>Selesai <b>${s.done}</b></div><div class="legend-line"><i style="background:#5d91ec"></i>Diproses <b>${s.process}</b></div><div class="legend-line"><i style="background:#efc27b"></i>Menunggu <b>${s.wait}</b></div></div></div></section>
 <section class="card panel"><h3>Laporan masuk 7 hari terakhir</h3><p class="panel-note">Berdasarkan waktu laporan dibuat.</p><div class="bar-chart">${days.map(d=>`<div class="bar-col"><div class="bar" title="${d.n} laporan" style="height:${Math.max(4,Math.round(d.n/max*140))}px"></div><span>${esc(d.day)}</span></div>`).join('')}</div></section></div>
 <div class="section-head"><div><h2>Kelola status pelaporan</h2><p>Ubah pilihan status; dashboard akan langsung menghitung ulang.</p></div><span class="sample-tag">Akses petugas: simulasi</span></div>
 <section class="card panel dash-table-wrap"><table class="dash-table"><thead><tr><th>ID / Laporan</th><th>Lokasi</th><th>Dibuat</th><th>Status laporan</th><th>Aksi</th></tr></thead><tbody>${recent.length?recent.map(r=>`<tr><td><strong>${esc(r.title)}</strong><small>${esc(r.id)} · ${esc(r.category)}</small></td><td>${esc(r.place)}</td><td>${date(r.createdAt)}</td><td><select class="select-status" data-status-id="${esc(r.id)}" aria-label="Ubah status ${esc(r.id)}"><option value="wait" ${r.status==='wait'?'selected':''}>Menunggu</option><option value="process" ${r.status==='process'?'selected':''}>Diproses</option><option value="done" ${r.status==='done'?'selected':''}>Selesai</option></select></td><td><button class="btn btn-ghost btn-small" data-detail="${esc(r.id)}">Detail</button></td></tr>`).join(''):'<tr><td colspan="5">Belum ada laporan</td></tr>'}</tbody></table></section>
 <div class="note-band">${icon('shield','lg')} <div><strong>Indikator demonstrasi:</strong> tindak lanjut ${(s.follow)}%, titik berstatus selesai ${s.done}, rata-rata penyelesaian ${avgText(s.avg)}. Semuanya dihitung dari status dan waktu dalam browser. <strong>Bukan bukti bahwa titik telah bersih atau paparan kesehatan menurun.</strong></div></div>`;}
 function detail(id){const r=reports.find(r=>r.id===id);if(!r)return;const steps=[{name:'Laporan dibuat',t:r.createdAt},{name:'Petugas mulai memproses',t:r.startedAt},{name:'Status ditandai selesai',t:r.doneAt}];$('#modalMount').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="Detail laporan"><div class="modal-top"><div><div class="eyebrow">${esc(r.id)}</div><h2 style="margin:8px 0 9px">${esc(r.title)}</h2>${badge(r.status)}</div><button class="round-btn" data-close-modal aria-label="Tutup detail">${icon('close')}</button></div>
 <div class="detail-list"><div><small>Kategori</small><strong>${esc(r.category)}</strong></div><div><small>Lokasi</small><strong>${esc(r.place)}</strong></div><div><small>Pelapor demo</small><strong>${esc(r.author||'Anonim')}</strong></div><div><small>Dibuat</small><strong>${dateTime(r.createdAt)}</strong></div></div><h3 style="margin:25px 0 5px">Deskripsi</h3><p style="font-size:13px;color:#596e61">${esc(r.detail)}</p>${r.photo?`<img class="modal-image" alt="Foto laporan dari pengguna" src="${r.photo}" />`:''}<h3 style="margin:23px 0 0">Riwayat status</h3><div class="timeline">${steps.map(s=>`<div class="time-item"><strong>${s.name}</strong><br/><small>${s.t?dateTime(s.t):'Belum dilakukan'}</small></div>`).join('')}</div><div class="note-band">${icon('info','sm')} Data ini hanya merekam perubahan status demonstrasi, bukan catatan verifikasi petugas sebenarnya.</div></section></div>`;}
 async function photoToData(file){if(!file)return null;if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Gunakan file JPG, PNG atau WEBP.');if(file.size>5*1024*1024)throw new Error('Ukuran foto maksimal 5 MB.');const img=await createImageBitmap(file);const scale=Math.min(1,960/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);if(img.close)img.close();return canvas.toDataURL('image/jpeg',.58);}
 function updateStatus(id,next){const r=reports.find(r=>r.id===id);if(!r||!STATUS[next])return;if(r.status===next)return;const now=new Date().toISOString();if(next==='wait'){r.startedAt=null;r.doneAt=null;}if(next==='process'){r.startedAt=r.startedAt||now;r.doneAt=null;}if(next==='done'){r.startedAt=r.startedAt||now;r.doneAt=now;}r.status=next;save();render();toast(`Status ${id} diperbarui: ${STATUS[next]}`);}
 function setRoute(next){if(!icons[next])return;route=next;filter='all';search='';photoDraft=null;render();window.scrollTo({top:0,behavior:'instant'});}
 function render(){const names={home:['Beranda','Ringkasan Lingkungan'],report:['Buat Laporan','Laporan Masyarakat'],status:['Status Laporan','Pelacakan Laporan'],dashboard:['Dashboard Petugas','Analitik & Respons'],learn:['Edukasi','EcoLearn & EcoMission'],news:['Berita','EcoNews']};$('#topBreadcrumb').textContent=names[route][0];$('#topTitle').textContent=names[route][1];$('#topIcon').setAttribute('href','#'+icons[route]);document.querySelectorAll('[data-route]').forEach(b=>{b.classList.toggle('active',b.dataset.route===route);if(b.classList.contains('nav-link'))b.setAttribute('aria-current',b.dataset.route===route?'page':'false');});$('#page').innerHTML=route==='home'?home()+homeExtras():route==='report'?reportPage():route==='status'?statusPage():route==='learn'?learnPage():route==='news'?newsPage():dash();if(route==='status')renderRecords();if(route==='learn')renderLessonCards();if(route==='news')renderNewsList();updateNewsAlerts();}
 document.addEventListener('click',e=>{
  const read=e.target.closest('[data-eco-read]');if(read){const id=read.dataset.ecoRead;if(!lessons.some(x=>x.id===id))return;learning.read=learning.read.includes(id)?learning.read.filter(x=>x!==id):[...learning.read,id];saveLearn();render();return;}
  const answer=e.target.closest('[data-eco-answer]');if(answer){const d=dayNumber(),i=Number(answer.dataset.ecoAnswer);if(learning.answers[d]===undefined&&Number.isInteger(i)&&i>=0&&i<3){learning.answers[d]=i;saveLearn();render();}return;}
  if(e.target.closest('#ecoRefresh')){refreshNews();return;}
  const newsOpen=e.target.closest('[data-eco-news-open]');if(newsOpen){const u=newsOpen.dataset.ecoNewsOpen;if(u&&!seenNews.includes(u)){seenNews.push(u);saveSeen();updateNewsAlerts();}return;}
  if(e.target.closest('#ecoMoreNews')){newsLimit+=12;renderNewsList();return;}
  if(e.target.closest('#ecoMoreLessons')){lessonShown+=12;renderLessonCards();return;}
  const nav=e.target.closest('[data-route]');if(nav){setRoute(nav.dataset.route);return;}
  const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));renderRecords();return;}
  const d=e.target.closest('[data-detail]');if(d){detail(d.dataset.detail);return;}
  if(e.target.closest('[data-close-modal]')||e.target.id==='modalBackdrop'){$('#modalMount').innerHTML='';return;}
  if(e.target.closest('#resetDemo')){if(confirm('Reset semua laporan ke data simulasi awal? Laporan buatanmu di browser ini akan terhapus.')){reports=seed.map(r=>({...r}));save();render();toast('Data simulasi telah direset.');}}
 });
 document.addEventListener('input',e=>{if(e.target.id==='searchReports'){search=e.target.value;renderRecords();}if(e.target.id==='ecoNewsSearch'){newsSearch=e.target.value;newsLimit=12;renderNewsList();}if(e.target.id==='ecoLessonSearch'){lessonSearch=e.target.value;lessonShown=12;renderLessonCards();}});
 document.addEventListener('change',e=>{
  if(e.target.dataset.ecoMission){const id=e.target.dataset.ecoMission;if(currentMissions().some(x=>x.id===id)){learning.missions[weekNumber()+':'+id]=e.target.checked;saveLearn();render();}return;}
  if(e.target.id==='ecoLessonCategory'){lessonCategory=e.target.value;lessonShown=12;renderLessonCards();return;}
  if(e.target.id==='ecoNewsSource'){newsSource=e.target.value;newsLimit=12;renderNewsList();return;}
  if(e.target.id==='ecoNewsRecent'){newsRecent=e.target.checked;newsLimit=12;renderNewsList();return;}
  if(e.target.dataset.statusId){updateStatus(e.target.dataset.statusId,e.target.value);return;}
  if(e.target.id==='r-photo'){const file=e.target.files?.[0];photoDraft=file||null;const box=$('#filePreview');if(!box)return;if(!file){box.innerHTML=`${icon('camera','lg')}<strong>Pilih gambar untuk laporan</strong>`;return;}if(file.size>5*1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('Pilih JPG/PNG/WEBP maksimal 5 MB.');e.target.value='';photoDraft=null;return;}const url=URL.createObjectURL(file);box.innerHTML=`<img src="${url}" alt="Pratinjau foto sebelum dikirim"/><strong>${esc(file.name)}</strong><small>Klik untuk mengganti foto</small>`;setTimeout(()=>URL.revokeObjectURL(url),5000);}
 });
 document.addEventListener('submit',async e=>{
  if(e.target.id!=='reportForm')return;e.preventDefault();const form=e.target;if(!form.reportValidity())return;const button=form.querySelector('button[type=submit]');button.disabled=true;button.textContent='Menyimpan...';const fd=new FormData(form);try{const photo=await photoToData(photoDraft);const report={id:'EC-'+String(Date.now()).slice(-8),title:String(fd.get('title')||'').trim(),category:String(fd.get('category')||''),place:String(fd.get('place')||'').trim(),detail:String(fd.get('detail')||'').trim(),author:String(fd.get('author')||'').trim()||'Warga Demo',status:'wait',createdAt:new Date().toISOString(),startedAt:null,doneAt:null,photo};if(!report.title||!report.category||!report.place||!report.detail)throw Error('Lengkapi kolom wajib.');reports.unshift(report);save();setRoute('status');toast(`Laporan ${report.id} berhasil dibuat (simulasi).`);detail(report.id);}catch(error){toast(error.message||'Gagal memproses laporan.');button.disabled=false;button.innerHTML=`${icon('upload','sm')} Kirim Laporan Simulasi`;}
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#modalMount').innerHTML='';}});
 restoreNewsCache();
 render();
 loadLibrary();
 refreshNews();
})();
</script>
</body>
</html>
